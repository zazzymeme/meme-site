<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$ZAZZY — The Fairest Meme Coin</title>

    <link rel="icon" href="favicon.png" sizes="512x512">

    <!-- iOS Safari optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#000;color:#fff;overflow-x:hidden;position:relative;
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:transparent;
        }

        html,body{height:100%}

        /* ================= BACKGROUND ================= */
        #bg-video{
            position:fixed;top:0;left:0;width:100%;height:100%;
            object-fit:cover;z-index:1;pointer-events:none;
        }
        .overlay{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.68);z-index:2
        }

        /* ================= MENU ================= */
        .menu-wrapper{
            position:fixed;top:20px;right:20px;z-index:1000;
        }

        .burger{
            width:34px;height:26px;display:none;
            flex-direction:column;justify-content:space-between;
            cursor:pointer;
        }
        .burger span{
            height:4px;background:#27F5F2;border-radius:2px;
            box-shadow:0 0 12px #27F5F2;
        }

        .menu{
            position:fixed;top:0;right:-100%;
            width:100%;height:100svh;
            background:rgba(0,0,0,0.92);
            display:flex;flex-direction:column;
            justify-content:center;align-items:center;
            gap:35px;transition:right .4s ease;
        }
        .menu.active{right:0}
        .menu a{
            font-weight:500;font-size:1.4rem;
            color:#e0e0e0;text-decoration:none;
            text-transform:uppercase;letter-spacing:3px;
        }
        .menu a:hover{color:#27F5F2;text-shadow:0 0 20px #27F5F2}

        @media(min-width:769px){
            .burger{display:none}
            .menu{
                position:absolute;right:auto;left:50%;
                transform:translateX(-50%);
                height:auto;background:none;
                flex-direction:row;gap:45px;
            }
        }
        @media(max-width:768px){
            .burger{display:flex}
            #bg-video{display:none}
            body{
                background:radial-gradient(circle at top,#0b3f3f,#000 70%);
            }
        }

        /* ================= SECTIONS ================= */
        .section{
            min-height:100svh;
            padding:160px 20px 100px;
            text-align:center;position:relative;z-index:10;
        }

        .logo{
            width:320px;height:320px;border-radius:50%;
            border:1.5px solid #27F5F2;
            box-shadow:0 0 30px rgba(39,245,242,.8);
            animation:pulse 4s infinite;
        }
        @keyframes pulse{
            0%,100%{box-shadow:0 0 30px rgba(39,245,242,.8)}
            50%{box-shadow:0 0 70px #27F5F2}
        }

        h1{
            font-family:'Orbitron',sans-serif;
            font-size:8.5rem;color:#27F5F2;
            text-shadow:0 0 60px rgba(39,245,242,.8);
            margin:40px 0;
        }

        .manifesto{
            max-width:1000px;margin:60px auto;
            line-height:1.7;font-size:1.6rem;
        }
        .manifesto strong{color:#27F5F2;font-size:1.8rem}

        .ca{
            background:rgba(39,245,242,.15);
            padding:18px 40px;border-radius:18px;
            border:2px solid #27F5F2;
            color:#27F5F2;font-family:monospace;
            font-size:1.3rem;margin:70px 0;
        }

        .icon-buttons{
            display:flex;justify-content:center;
            gap:60px;flex-wrap:wrap;margin:80px 0;
        }
        .icon-buttons a{
            width:100px;height:100px;
            filter:drop-shadow(0 0 20px #27F5F2);
            transition:.4s;
        }
        .icon-buttons a:hover{
            transform:translateY(-15px) scale(1.15);
        }
        .icon-buttons img{
            width:100%;height:100%;object-fit:contain;
        }

        /* ================= INFO BLOCK ================= */
        .info-block{
            margin:120px auto;max-width:1100px;
            background:rgba(255,255,255,.06);
            backdrop-filter:blur(20px);
            border:1px solid rgba(39,245,242,.4);
            border-radius:30px;
            padding:80px 50px;
            opacity:0;transform:translateY(60px);
            transition:all 1s ease;
        }
        .info-block.animated{
            opacity:1;transform:none;
        }

        .block-title{
            font-size:4.5rem;
            font-family:'Orbitron',sans-serif;
            color:#27F5F2;margin-bottom:60px;
        }

        .supply{font-size:2.2rem;margin:30px 0}
        .supply strong{color:#27F5F2}

        .about-text{
            max-width:720px;margin:0 auto;
            font-size:1.4rem;line-height:1.6;
        }
        .about-text strong{color:#27F5F2}

        /* ================= MOBILE ================= */
        @media(max-width:768px){
            h1{font-size:3.5rem}
            .logo{width:200px;height:200px}
            .manifesto{font-size:1.25rem}
            .block-title{font-size:2.8rem}
            .info-block{padding:50px 25px}
            .icon-buttons a{width:70px;height:70px}
        }
    </style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline>
    <source src="https://i.imgur.com/Wt2peow.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="menu-wrapper">
    <div class="burger" id="burger">
        <span></span><span></span><span></span>
    </div>
    <nav class="menu" id="menu">
        <a href="#about">About</a>
        <a href="#howtobuy">Buy Zazzy</a>
        <a href="#tokenomics-block">Tokenomics</a>
        <a href="#contract">Contract</a>
        <a href="#">Telegram</a>
        <a href="#">X</a>
    </nav>
</div>

<section id="howtobuy" class="section">
    <img src="logo.png" class="logo" alt="ZAZZY">
    <h1>$ZAZZY</h1>

    <div class="manifesto">
        Maximum <strong>0.1%</strong> per wallet. Forever.<br>
        No whales. No rugs. Only fairness.
    </div>

    <p class="ca" id="contract">0xYOUR_CONTRACT_ADDRESS</p>

    <div class="icon-buttons">
        <a href="#"><img src="PancakeSwap.png" loading="lazy"></a>
        <a href="#"><img src="DexScreener.png" loading="lazy"></a>
        <a href="#"><img src="CoinGecko.png" loading="lazy"></a>
        <a href="#"><img src="CoinmarketCap.png" loading="lazy"></a>
        <a href="#"><img src="Telegram.png" loading="lazy"></a>
        <a href="#"><img src="x.png" loading="lazy"></a>
        <a href="#"><img src="GitHub.png" loading="lazy"></a>
        <a href="#"><img src="Reddit.png" loading="lazy"></a>
    </div>
</section>

<section id="tokenomics-block" class="info-block section">
    <div class="block-title">TOKENOMICS</div>
    <div class="supply">Total Supply: <strong>1,000,000,000,000,000 ZAZZY</strong></div>
</section>

<section id="about" class="info-block section">
    <div class="block-title">ABOUT</div>
    <div class="about-text">
        <strong>The code is the law.</strong><br><br>
        No whales. No team tokens. No lies.<br>
        Just pure on-chain fairness.
    </div>
</section>

<script>
    const burger=document.getElementById('burger');
    const menu=document.getElementById('menu');

    burger.addEventListener('click',()=>{
        menu.classList.toggle('active');
    });

    document.querySelectorAll('.menu a').forEach(link=>{
        link.addEventListener('click',()=>{
            menu.classList.remove('active');
        });
    });

    document.querySelectorAll('.info-block').forEach(block=>{
        const obs=new IntersectionObserver(entries=>{
            entries.forEach(e=>{
                if(e.isIntersecting)block.classList.add('animated');
            });
        },{threshold:.3});
        obs.observe(block);
    });
</script>

</body>
</html>
